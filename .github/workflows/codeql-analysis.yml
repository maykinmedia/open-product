name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '0 23 * * 6'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
